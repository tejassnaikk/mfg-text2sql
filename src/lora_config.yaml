# MLX-LM LoRA config -- manufacturing text-to-SQL fine-tune.
# Checked in for reproducibility: this file *is* the experiment.

model: "mlx-community/Qwen2.5-3B-Instruct-4bit"
train: true

data: "data/mlx"          # expects train.jsonl / valid.jsonl here
adapter_path: "adapters"

# LoRA scope: conservative rank, last 8 layers (output-shaping layers).
fine_tune_type: lora
num_layers: 8
lora_parameters:
  rank: 8
  scale: 16.0
  dropout: 0.0

# ~1.3 epochs over 1792 examples at batch 4. Narrow task -> few iters on purpose.
iters: 150
batch_size: 4
max_seq_length: 1024
learning_rate: 1.0e-4

# checkpoint + validate often enough to catch overfitting early
steps_per_report: 25
steps_per_eval: 50
save_every: 25
val_batches: 8
grad_checkpoint: true       # trade compute for memory on the M4
seed: 42
